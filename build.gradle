// TetraMCP for Ghidra - Unified Model Context Protocol server for Ghidra

defaultTasks 'buildExtension'
apply plugin: 'java-library'

//------------------------------------------------------------------------------
// Ghidra install directory resolution
//------------------------------------------------------------------------------

def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
    ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
    ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else {
    throw new GradleException(
        "GHIDRA_INSTALL_DIR is not set. Set it as an environment variable " +
        "or in gradle.properties (e.g., GHIDRA_INSTALL_DIR=/opt/ghidra)")
}

apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"

//------------------------------------------------------------------------------
// Java configuration
//------------------------------------------------------------------------------

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

//------------------------------------------------------------------------------
// Repositories
//------------------------------------------------------------------------------

repositories {
    mavenCentral()
}

//------------------------------------------------------------------------------
// Dependencies
//------------------------------------------------------------------------------

configurations {
    all {
        // Exclude Jackson 3.x (pulled by mcp-json-jackson3 transitive)
        exclude group: 'tools.jackson.core'
        exclude group: 'io.modelcontextprotocol.sdk', module: 'mcp-json-jackson3'

        // Exclude SLF4J - Ghidra provides its own version (1.7.x).
        // Bundling 2.x causes classloader corruption on shutdown.
        exclude group: 'org.slf4j'

        // Exclude transitive deps we don't need
        exclude group: 'org.yaml', module: 'snakeyaml'
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'

        resolutionStrategy {
            // Force consistent Jackson 2.x versions
            force "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
            force "com.fasterxml.jackson.core:jackson-annotations:${jacksonAnnotationsVersion}"
        }
    }
}

dependencies {
    // MCP Java SDK (BOM for version management)
    implementation platform("io.modelcontextprotocol.sdk:mcp-bom:${mcpSdkVersion}")
    implementation "io.modelcontextprotocol.sdk:mcp-core"
    implementation("io.modelcontextprotocol.sdk:mcp") {
        // We use jackson2, not jackson3
        exclude group: 'io.modelcontextprotocol.sdk', module: 'mcp-json-jackson3'
    }
    implementation "io.modelcontextprotocol.sdk:mcp-json-jackson2"

    // Jetty 12 (embedded HTTP server for Streamable HTTP transport)
    implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-servlet:${jettyVersion}"

    // Jakarta Servlet API (required by MCP SDK's HttpServletStreamableServerTransportProvider)
    implementation "jakarta.servlet:jakarta.servlet-api:6.1.0"

    // Jackson 2.x (JSON serialization)
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonAnnotationsVersion}"

    // Reactor (required by MCP SDK for async operations)
    implementation "io.projectreactor:reactor-core:3.7.6"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.hamcrest:hamcrest:3.0"
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    integrationTest {
        java {
            srcDirs = ['src/test.slow/java']
        }
        resources {
            srcDirs = ['src/test.slow/resources']
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
}

// Ghidra 12.1+ installs a global deserialization filter factory during
// ApplicationConfiguration init. Java allows setSerialFilterFactory() only
// once, and Gradle test workers deserialize over their daemon socket first —
// locking the factory and causing "Cannot replace filter factory". Specifying
// it at JVM startup lets Ghidra reuse it. The class only exists on 12.1+.
def ghidraSupportsSerialFilterFactory = {
    def propsFile = new File(ghidraInstallDir, "Ghidra/application.properties")
    if (!propsFile.exists()) {
        return false
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    def parts = (props.getProperty("application.version", "0") =~ /\d+/).collect { it as int }
    def major = parts.size() > 0 ? parts[0] : 0
    def minor = parts.size() > 1 ? parts[1] : 0
    return major > 12 || (major == 12 && minor >= 1)
}()

test {
    if (ghidraSupportsSerialFilterFactory) {
        jvmArgs '-Djdk.serialFilterFactory=ghidra.framework.remote.GhidraSerialFilterFactory'
    }
    testLogging {
        events = ['failed', 'standardError']
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
    }
}

task integrationTest(type: Test) {
    group = 'verification'
    description = 'Runs integration tests against a real Ghidra installation'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    // Fork every test class to prevent Ghidra Application init conflicts
    forkEvery = 1
    systemProperty 'java.awt.headless', 'false'

    if (ghidraSupportsSerialFilterFactory) {
        jvmArgs '-Djdk.serialFilterFactory=ghidra.framework.remote.GhidraSerialFilterFactory'
    }

    exclude '**/*Suite*'

    testLogging {
        events = ['failed', 'standardError']
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
    }
}

check.dependsOn integrationTest

//------------------------------------------------------------------------------
// Install task - deploy extension to Ghidra
//------------------------------------------------------------------------------

task install(type: Copy) {
    group = "Ghidra"
    description = "Install extension into Ghidra installation"

    dependsOn buildExtension

    // Resolve the zip lazily. The previous implementation called
    // file("dist").listFiles() at configuration time, which picked a stale zip
    // and found nothing at all on a clean checkout.
    from { zipTree(buildExtension.archiveFile) }
    into new File(ghidraInstallDir, "Ghidra/Extensions")
}
