name: Test

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Setup Ghidra
      id: ghidra
      uses: ./.github/actions/setup-ghidra

    - name: Run unit tests
      run: |
        export GHIDRA_INSTALL_DIR="${{ steps.ghidra.outputs.install-dir }}"
        chmod +x gradlew
        ./gradlew test

    - name: Run integration tests
      run: |
        export GHIDRA_INSTALL_DIR="${{ steps.ghidra.outputs.install-dir }}"
        xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew integrationTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          build/reports/tests/
          build/test-results/
