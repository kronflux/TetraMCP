name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Resolve latest Ghidra version
      id: ghidra
      run: |
        VERSION=$(curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
          | jq -r .tag_name | sed 's/Ghidra_//' | sed 's/_build//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download Ghidra
      run: |
        GHIDRA_VERSION="${{ steps.ghidra.outputs.version }}"
        DOWNLOAD_URL=$(curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
          | jq -r '.assets[0].browser_download_url')
        if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          echo "::error::Could not find Ghidra release"
          exit 1
        fi
        # Download/unpack Ghidra OUTSIDE the checkout so the Gradle project dir
        # never contains the Ghidra distribution (buildExtension copies the whole
        # project dir; a Ghidra install inside it would be packaged into the zip).
        cd "$RUNNER_TEMP"
        curl -Lo ghidra.zip "$DOWNLOAD_URL"
        unzip -q ghidra.zip
        mv ghidra_* ghidra_install

    - name: Build extension
      run: |
        export GHIDRA_INSTALL_DIR="$RUNNER_TEMP/ghidra_install"
        chmod +x gradlew
        ./gradlew buildExtension

    - name: Prepare release artifact
      id: artifact
      run: |
        GHIDRA_VER="${{ steps.ghidra.outputs.version }}"
        ARTIFACT_NAME="TetraMCP-ghidra-${GHIDRA_VER}.zip"
        cp dist/*.zip "dist/${ARTIFACT_NAME}"
        cd dist
        sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
        cat "${ARTIFACT_NAME}.sha256"
        echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
        echo "ghidra_ver=${GHIDRA_VER}" >> $GITHUB_OUTPUT

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: |
          dist/${{ steps.artifact.outputs.name }}
          dist/${{ steps.artifact.outputs.name }}.sha256

    - name: Create or update release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ghidra-${{ steps.artifact.outputs.ghidra_ver }}
        name: TetraMCP for Ghidra ${{ steps.artifact.outputs.ghidra_ver }}
        body: |
          TetraMCP extension built for Ghidra ${{ steps.artifact.outputs.ghidra_ver }}.

          Install via **File > Install Extensions** in Ghidra, then enable **TetraMcpPlugin** under **File > Configure > Developer**.

          MCP endpoint: `http://localhost:18489/mcp`

          **SHA256 checksum included** — verify with: `sha256sum -c TetraMCP-ghidra-${{ steps.artifact.outputs.ghidra_ver }}.zip.sha256`
        make_latest: true
        files: |
          dist/${{ steps.artifact.outputs.name }}
          dist/${{ steps.artifact.outputs.name }}.sha256
