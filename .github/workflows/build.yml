name: Build

on:
  push:
    branches: [ main ]
    # A release tag names the Ghidra version it is for, and that version is
    # what gets built - see the "Ghidra version to build against" step.
    tags: [ 'ghidra-*' ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Ghidra version to build against
      id: target
      run: |
        # A ghidra-<version> tag names the version to build. Any other ref
        # takes whatever Ghidra is latest, which is what a branch build wants.
        if [[ "$GITHUB_REF" == refs/tags/ghidra-* ]]; then
          echo "version=${GITHUB_REF_NAME#ghidra-}" >> "$GITHUB_OUTPUT"
        else
          echo "version=" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Ghidra
      id: ghidra
      uses: ./.github/actions/setup-ghidra
      with:
        version: ${{ steps.target.outputs.version }}

    # After Setup Ghidra, because the release that was installed names the Java
    # version its extensions are compiled at.
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.ghidra.outputs.java-version }}
        distribution: 'temurin'

    - name: Point the wrapper at the resolved Gradle
      env:
        GRADLE_DISTRIBUTION_URL: ${{ steps.ghidra.outputs.gradle-distribution-url }}
      run: |
        sed -i "s|^distributionUrl=.*|distributionUrl=${GRADLE_DISTRIBUTION_URL}|" \
          gradle/wrapper/gradle-wrapper.properties
        grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

    - name: Run unit tests
      run: |
        export GHIDRA_INSTALL_DIR="${{ steps.ghidra.outputs.install-dir }}"
        chmod +x gradlew
        ./gradlew test

    - name: Run integration tests
      run: |
        export GHIDRA_INSTALL_DIR="${{ steps.ghidra.outputs.install-dir }}"
        xvfb-run -a --server-args="-screen 0 1920x1080x24" ./gradlew integrationTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          build/reports/tests/
          build/test-results/

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Ghidra version to build against
      id: target
      run: |
        # A ghidra-<version> tag names the version to build. Any other ref
        # takes whatever Ghidra is latest, which is what a branch build wants.
        if [[ "$GITHUB_REF" == refs/tags/ghidra-* ]]; then
          echo "version=${GITHUB_REF_NAME#ghidra-}" >> "$GITHUB_OUTPUT"
        else
          echo "version=" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Ghidra
      id: ghidra
      uses: ./.github/actions/setup-ghidra
      with:
        version: ${{ steps.target.outputs.version }}

    # After Setup Ghidra, because the release that was installed names the Java
    # version its extensions are compiled at.
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ steps.ghidra.outputs.java-version }}
        distribution: 'temurin'

    - name: Point the wrapper at the resolved Gradle
      env:
        GRADLE_DISTRIBUTION_URL: ${{ steps.ghidra.outputs.gradle-distribution-url }}
      run: |
        sed -i "s|^distributionUrl=.*|distributionUrl=${GRADLE_DISTRIBUTION_URL}|" \
          gradle/wrapper/gradle-wrapper.properties
        grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

    - name: Build extension
      run: |
        export GHIDRA_INSTALL_DIR="${{ steps.ghidra.outputs.install-dir }}"
        chmod +x gradlew
        ./gradlew buildExtension

    - name: Prepare release artifact
      id: artifact
      run: |
        GHIDRA_VER="${{ steps.ghidra.outputs.version }}"
        ARTIFACT_NAME="TetraMCP-ghidra-${GHIDRA_VER}.zip"
        cp dist/*.zip "dist/${ARTIFACT_NAME}"
        cd dist
        sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
        cat "${ARTIFACT_NAME}.sha256"
        echo "name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
        echo "ghidra_ver=${GHIDRA_VER}" >> $GITHUB_OUTPUT

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: |
          dist/${{ steps.artifact.outputs.name }}
          dist/${{ steps.artifact.outputs.name }}.sha256

    # The release for a Ghidra version holds the newest build that succeeded for
    # it, so the tag it is cut from moves to the commit that built and the tag,
    # the release and the files it carries name the same source. On a tag push
    # the tag already names this commit and the move changes nothing. The push
    # uses GITHUB_TOKEN, whose ref updates start no workflow run, so tagging
    # here does not trigger this workflow again.
    - name: Point the Ghidra version tag at this commit
      env:
        TAG: ghidra-${{ steps.ghidra.outputs.version }}
      run: |
        git tag -f "$TAG"
        git push -f origin "refs/tags/$TAG"

    # The notes carry the changelog section for the Ghidra version being built,
    # so a release says what changed rather than only which Ghidra it targets.
    # A version with no section yet releases with the installation notes alone
    # and a warning, because a documentation gap is not a reason to withhold a
    # build that passed.
    - name: Assemble the release notes
      env:
        GHIDRA_VER: ${{ steps.artifact.outputs.ghidra_ver }}
        ARTIFACT: ${{ steps.artifact.outputs.name }}
      run: |
        # The trailing space in the pattern keeps "12.1" from matching "12.1.2".
        awk -v heading="## Ghidra ${GHIDRA_VER} " '
          index($0, heading) == 1 { inside = 1; next }
          inside && /^## / { exit }
          inside { print }
        ' CHANGELOG.md > changes.md
        if [ ! -s changes.md ]; then
          echo "::warning::CHANGELOG.md has no section for Ghidra ${GHIDRA_VER}"
        fi
        {
          echo "TetraMCP extension built for Ghidra ${GHIDRA_VER}."
          echo
          if [ -s changes.md ]; then
            echo "## Changes"
            cat changes.md
          else
            echo "No changelog section records this version yet."
            echo
          fi
          echo "## Install"
          echo
          echo "In Ghidra, select **File > Install Extensions**, add"
          echo "\`${ARTIFACT}\`, restart, then enable **TetraMcpPlugin** under"
          echo "**File > Configure > Developer**. The server listens on"
          echo "\`http://localhost:18489/mcp\`."
          echo
          echo "Verify the download with \`sha256sum -c ${ARTIFACT}.sha256\`."
          echo
          echo "Ghidra ${GHIDRA_VER}'s own release notes are at"
          echo "<https://github.com/NationalSecurityAgency/ghidra/releases/tag/Ghidra_${GHIDRA_VER}_build>."
        } > release-notes.md
        cat release-notes.md

    - name: Create or update release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ghidra-${{ steps.ghidra.outputs.version }}
        name: TetraMCP for Ghidra ${{ steps.artifact.outputs.ghidra_ver }}
        body_path: release-notes.md
        # A rebuild for an older Ghidra must not displace the current release.
        make_latest: ${{ steps.ghidra.outputs.is-latest }}
        files: |
          dist/${{ steps.artifact.outputs.name }}
          dist/${{ steps.artifact.outputs.name }}.sha256
