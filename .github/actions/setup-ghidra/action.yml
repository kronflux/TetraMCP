name: 'Setup Ghidra'
description: 'Downloads a Ghidra release, outside the workspace'
inputs:
  version:
    description: >
      Ghidra version to install, such as 12.1.2. Empty installs whatever
      release is currently latest, which is what a run not tied to a
      particular version wants.
    required: false
    default: ''
outputs:
  version:
    description: 'Installed Ghidra version'
    value: ${{ steps.resolve.outputs.version }}
  is-latest:
    description: 'Whether the installed version is the latest Ghidra release'
    value: ${{ steps.resolve.outputs.is-latest }}
  install-dir:
    description: 'Absolute path to the unpacked Ghidra install'
    value: ${{ steps.resolve.outputs.install-dir }}
runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        API=https://api.github.com/repos/NationalSecurityAgency/ghidra/releases

        # Fetched even when a version is named, so a release can say whether it
        # is the current one rather than every build claiming to be.
        if ! LATEST=$(curl -sSf "$API/latest"); then
          echo "::error::Could not reach the Ghidra releases API"
          exit 1
        fi
        LATEST_VERSION=$(echo "$LATEST" | jq -r .tag_name | sed 's/Ghidra_//; s/_build//')

        if [ -z "$REQUESTED_VERSION" ]; then
          RELEASE="$LATEST"
        else
          # Ghidra tags a release Ghidra_<version>_build.
          if ! RELEASE=$(curl -sSf "$API/tags/Ghidra_${REQUESTED_VERSION}_build"); then
            echo "::error::No Ghidra release tagged Ghidra_${REQUESTED_VERSION}_build."
            echo "::error::The version must name a real Ghidra release. Latest is ${LATEST_VERSION}."
            exit 1
          fi
        fi

        # Select by NAME PATTERN. The previous `.assets[0]` pick was index-based
        # and silently grabbed whatever asset happened to sort first.
        URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$")) | .browser_download_url' | head -1)
        VERSION=$(echo "$RELEASE" | jq -r .tag_name | sed 's/Ghidra_//; s/_build//')
        if [ -z "$URL" ] || [ "$URL" = "null" ]; then
          echo "::error::No Ghidra PUBLIC zip asset found in release Ghidra_${VERSION}_build"
          echo "$RELEASE" | jq -r '.assets[].name'
          exit 1
        fi

        if [ "$VERSION" = "$LATEST_VERSION" ]; then
          IS_LATEST=true
        else
          IS_LATEST=false
        fi

        echo "### Ghidra \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Asset: \`$(basename "$URL")\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Latest Ghidra release: \`$LATEST_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

        # Unpack OUTSIDE the checkout: buildExtension copies the whole project
        # dir, so a Ghidra install inside it would be packaged into the zip.
        cd "$RUNNER_TEMP"
        curl -Lo ghidra.zip "$URL"
        unzip -q ghidra.zip
        mv ghidra_* ghidra_install
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "is-latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
        echo "install-dir=$RUNNER_TEMP/ghidra_install" >> "$GITHUB_OUTPUT"
